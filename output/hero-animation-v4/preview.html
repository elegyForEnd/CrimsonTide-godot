<!doctype html><html lang="zh"><meta charset="utf-8"><title>绯月 · 新版走路</title><style>body{margin:0;background:#20222a;color:#eee;font:16px system-ui}main{max-width:1180px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 10px}p{color:#c4c5cd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.stage{background:repeating-conic-gradient(#e5e5e8 0% 25%,#f3f3f6 0% 50%) 0/24px 24px;border-radius:12px}.stage img{width:100%;display:block}h2{font-size:17px}button,select{font:inherit;padding:8px 15px;background:#373b49;color:white;border:1px solid #626778;border-radius:7px}input{width:50%;vertical-align:middle}.controls{display:flex;gap:15px;align-items:center;margin:18px 0}.small{font-size:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><h1>绯月 · 新版走路 8 帧</h1><p>沿用原始参考与留白，保留浅笑。左侧是完整步伐，右侧单独观察发梢、丝带和呆毛的小幅摆动。</p><div class="controls"><button id="play">暂停</button><label>速度 <select id="speed"><option value="160">慢速</option><option value="110" selected>正常</option><option value="80">快速</option></select></label><span id="label">第 1 / 8 帧</span><input id="scrub" type="range" min="0" max="7" value="0"></div><div class="grid"><section><h2>完整走路循环</h2><div class="stage"><img id="walk" src="hero-0/walk/000.png"></div></section><section><h2>头发动态 · 身体保持静止</h2><div class="stage"><img id="hair" src="hero-0/hair-preview/000.png"></div></section></div><p class="small">画布 1254 × 1254 · 人物约占画布高度 78–80% · 独立透明 PNG · 尚未替换游戏素材</p></main><script>let playing=true,frame=0,hair=0,last=0;const pad=n=>String(n).padStart(3,'0');const imgs=[];for(let n=0;n<8;n++){let i=new Image;i.src='hero-0/walk/'+pad(n)+'.png';imgs.push(i)}for(let n=0;n<24;n++){let i=new Image;i.src='hero-0/hair-preview/'+pad(n)+'.png';imgs.push(i)}function show(){document.querySelector('#walk').src='hero-0/walk/'+pad(frame)+'.png';document.querySelector('#hair').src='hero-0/hair-preview/'+pad(hair)+'.png';document.querySelector('#scrub').value=frame;document.querySelector('#label').textContent='第 '+(frame+1)+' / 8 帧'}document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暂停':'播放'};document.querySelector('#scrub').oninput=e=>{playing=false;document.querySelector('#play').textContent='播放';frame=+e.target.value;hair=frame*3;show()};let tick=0;function loop(t){let step=+document.querySelector('#speed').value/3;if(playing&&t-last>=step){last=t;hair=(hair+1)%24;tick=(tick+1)%3;if(tick===0)frame=(frame+1)%8;show()}requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></html>
